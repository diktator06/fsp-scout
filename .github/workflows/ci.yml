# Проверки на каждый push и pull request: линтеры, типы, тесты и сборка Docker-образов.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Бэкенд
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-trixie
        env:
          POSTGRES_USER: fsp
          POSTGRES_PASSWORD: fsp
          POSTGRES_DB: fsp_scout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fsp -d fsp_scout"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://fsp:fsp@localhost:5432/fsp_scout_test
      DATABASE_URL: postgresql+asyncpg://fsp:fsp@localhost:5432/fsp_scout
    steps:
      - uses: actions/checkout@v4
      - name: Системные библиотеки WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: python3 ../tools/check_code_style.py
      - name: Миграции применяются и совпадают с моделями
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest

  fsp-mock:
    name: Эмулятор ФСП
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fsp-registry-mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Данные участников воспроизводятся генератором
        run: uv run python -m scripts.generate_participants && git diff --exit-code app/data/participants.json
      - run: uv run pytest

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  images:
    name: Docker-образы
    runs-on: ubuntu-latest
    needs: [backend, fsp-mock, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
