<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новое приглашение — Скаут</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f1f8;font-family:Montserrat,Arial,Helvetica,sans-serif;color:#1c1d22;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1f8;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:20px;overflow:hidden;">
            <tr>
              <td style="background:#310f53;background-image:linear-gradient(135deg,#310f53 0%,#520978 100%);padding:28px 32px;">
                <span style="display:inline-block;background:#ff0053;color:#ffffff;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:6px 12px;border-radius:999px;">Новое приглашение</span>
                <div style="color:#ffffff;font-size:22px;font-weight:800;margin-top:16px;">{{ title }}</div>
                <div style="color:#d9cfee;font-size:14px;margin-top:6px;">{{ company_name }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="font-size:13px;color:#5b5e6b;margin:0 0 4px;text-transform:uppercase;letter-spacing:1px;font-weight:700;">Зарплата</p>
                <p style="font-size:24px;font-weight:800;color:#310f53;margin:0 0 4px;">{{ salary }}</p>
                <p style="font-size:13px;color:#5b5e6b;margin:0 0 20px;">{{ salary_basis }} · {{ work_format }}</p>
                <p style="font-size:15px;line-height:1.6;margin:0 0 24px;">
                  Компания пока видит только ваш обезличенный профиль. Имя и контакты откроются ей, только если вы примете приглашение.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:12px;background:#520978;">
                      <a href="{{ link }}" style="display:inline-block;padding:14px 28px;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;">Открыть приглашение</a>
                    </td>
                  </tr>
                </table>
                <p style="font-size:13px;line-height:1.6;color:#5b5e6b;margin:24px 0 0;">Ответить можно до {{ expires_at }}.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
