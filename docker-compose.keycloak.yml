# ФСП ID на полноценном Keycloak вместо встроенного эмулятора входа.
#   make up-keycloak
#   (то же: docker compose -f docker-compose.yml -f docker-compose.keycloak.yml up --build -d)
# Keycloak: http://localhost:8081, realm fsp; админка admin / admin — только для стенда.
# Участники для входа: fsp000021, fsp000030, fsp000012, fsp000007, пароль FspDemo2026.
# Реестр достижений остаётся в fsp-registry-mock и проверяет токены Keycloak по его JWKS.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=http://localhost:${KEYCLOAK_HOST_PORT:-8081}
      - --hostname-backchannel-dynamic=true
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realm-fsp.json:/opt/keycloak/data/import/realm-fsp.json:ro
    ports:
      - "${KEYCLOAK_HOST_PORT:-8081}:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  fsp-registry-mock:
    environment:
      TRUSTED_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-8081}/realms/fsp
      TRUSTED_JWKS_URL: http://keycloak:8080/realms/fsp/protocol/openid-connect/certs
      TRUSTED_PARTICIPANT_CLAIM: fsp_participant_id

  backend:
    environment:
      FSP_OIDC_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-8081}/realms/fsp
      FSP_INTERNAL_URL: http://keycloak:8080/realms/fsp
      FSP_REGISTRY_URL: http://fsp-registry-mock:8090
      FSP_PARTICIPANT_CLAIM: fsp_participant_id
    depends_on:
      keycloak:
        condition: service_healthy
